<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="https://use.typekit.net/dfq5tse.css" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      @media only screen and (orientation: landscape) and (max-width: 1366px) and (pointer: coarse) {
        body {
          overflow: hidden;
          height: 100vh;
        }
        body::before {
          content: "Please rotate your device";
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          color: #00ffff;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: clamp(18px, 3.5vw, 40px);
          text-align: center;
          z-index: 999999;
          background: #000064;
        }
      }

      body {
        font-family: "indivisible", sans-serif;
        font-weight: 500;
        font-style: normal;
        margin: 0;
        padding: 2vh 6rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: url("file3.png") no-repeat center center fixed;
        background-size: cover;
        background-color: #262be8;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(10, auto);
        gap: 1vw;
        justify-content: center;
        padding: 0 1rem;
        white-space: nowrap;
      }

      label,
      button,
      select,
      input,
      input[type="text"],
      input[type="color"],
      input[type="range"],
      #paintingList {
        background-color: #2626ff;
        color: #ffffff;
        border: none;
        border-radius: clamp(4px, 0.4vw, 8px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0.1rem 0.3rem;
        font-size: 0.8rem;
        font-family: "indivisible", sans-serif;
        font-weight: 500;
        font-style: normal;
        white-space: nowrap;
        text-overflow: ellipsis;
        text-align: center;
      }

      input::placeholder {
        color: #ffffff;
        opacity: 1;
        text-align: center;
      }

      label:hover,
      button:hover,
      select:hover,
      input:hover {
        background-color: #000064;
        cursor: pointer;
      }

      .canvas-container {
        position: relative;
        width: 35vw;
        aspect-ratio: 1 / 1;
        transform: translateY(2%);
        padding: 2%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      @media only screen and (max-width: 1366px) {
        .canvas-container {
          width: 80vw;
          aspect-ratio: 1 / 1;
          transform: translateY(0%);
        }
      }

      /* Range slider styling */
      input[type="range"] {
        -webkit-appearance: none;
        height: 1px;
        background: #af32ff;
        border-radius: 6px;
        outline: #ffff00;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 12px;
        height: 12px;
        background: #00ffff;
        border-radius: 50%;
        cursor: pointer;
      }

      canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      canvas#backgroundCanvas {
        z-index: 1;
      }
      canvas#paintCanvas {
        z-index: 2;
      }
      canvas#effectCanvas {
        z-index: 3;
        pointer-events: none;
      }

      /* Hide brushType dropdown initially */
      #brushType {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <label
        >Color: <input type="color" id="colorPicker" value="#000000"
      /></label>

      <label id="brushTypeLabel">Brush type</label>
      <select id="brushType">
        <option value="classic">Classic</option>
        <option value="soft">Softer</option>
        <option value="image1">Image brush 1</option>
        <option value="image2">Image brush 2</option>
      </select>

      <label
        >Brush size:
        <input type="range" id="brushSize" min="5" max="150" value="5"
      /></label>
      <label
        >Soft steps:
        <input type="range" id="softSteps" min="1" max="50" value="10"
      /></label>

      <button onclick="clearCanvas()">Clear</button>
      <button onclick="undoLastStroke()">Undo</button>

      <input type="text" id="paintingName" placeholder="Enter name:" />
      <button onclick="savePainting()">Save painting</button>

      <select id="paintingList" onchange="loadSelectedPainting()">
        <option value="">My paintings</option>
      </select>

      <button onclick="downloadCanvas()">Download PNG</button>
    </div>

    <div class="canvas-container">
      <canvas id="backgroundCanvas"></canvas>
      <canvas id="paintCanvas"></canvas>
      <canvas id="effectCanvas"></canvas>
    </div>

    <script>
      const paintCanvas = document.getElementById("paintCanvas");
      const paintCtx = paintCanvas.getContext("2d");
      const bgCanvas = document.getElementById("backgroundCanvas");
      const bgCtx = bgCanvas.getContext("2d");
      const effectCanvas = document.getElementById("effectCanvas");
      const effectCtx = effectCanvas.getContext("2d");

      const colorPicker = document.getElementById("colorPicker");
      const brushSize = document.getElementById("brushSize");
      const softSteps = document.getElementById("softSteps");
      const brushType = document.getElementById("brushType");
      const paintingList = document.getElementById("paintingList");

      let historyStack = [];
      const maxHistory = 50;
      let painting = false,
        lastX = 0,
        lastY = 0;

      let brushImage1 = new Image();
      brushImage1.src = "/supina.png";
      let brushImage2 = new Image();
      brushImage2.src = "/supina2.png";

      const bgImage = new Image();
      bgImage.src = "/UVtransparent.png";
      const effectImage = new Image();
      effectImage.src = "/overlinky.png";

      function resizeCanvases() {
        const container = document.querySelector(".canvas-container");
        const rect = container.getBoundingClientRect();

        const oldPaint = document.createElement("canvas");
        oldPaint.width = paintCanvas.width;
        oldPaint.height = paintCanvas.height;
        oldPaint.getContext("2d").drawImage(paintCanvas, 0, 0);

        [paintCanvas, bgCanvas, effectCanvas].forEach((c) => {
          c.width = rect.width;
          c.height = rect.height;
        });

        paintCtx.drawImage(oldPaint, 0, 0, rect.width, rect.height);
        bgCtx.drawImage(bgImage, 0, 0, rect.width, rect.height);
        drawEffect();
      }

      function drawEffect() {
        effectCtx.clearRect(0, 0, effectCanvas.width, effectCanvas.height);
        effectCtx.drawImage(
          effectImage,
          0,
          0,
          effectCanvas.width,
          effectCanvas.height
        );
      }

      window.addEventListener("resize", resizeCanvases);
      bgImage.onload = resizeCanvases;
      effectImage.onload = drawEffect;

      function getCoordinates(e) {
        const rect = paintCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      }

      function saveToHistory() {
        if (historyStack.length >= maxHistory) historyStack.shift();
        historyStack.push(
          paintCtx.getImageData(0, 0, paintCanvas.width, paintCanvas.height)
        );
      }

      function startPainting(e) {
        saveToHistory();
        painting = true;
        const { x, y } = getCoordinates(e);
        lastX = x;
        lastY = y;
      }

      function draw(e) {
        if (!painting) return;
        e.preventDefault();
        const { x, y } = getCoordinates(e);
        const mirrorX = paintCanvas.width - x;

        paintCtx.lineCap = "round";
        paintCtx.strokeStyle = colorPicker.value;

        if (brushType.value === "classic") {
          paintCtx.lineWidth = brushSize.value;
          paintCtx.beginPath();
          paintCtx.moveTo(lastX, lastY);
          paintCtx.lineTo(x, y);
          paintCtx.stroke();
        } else {
          const img = brushType.value === "image1" ? brushImage1 : brushImage2;
          paintCtx.drawImage(
            img,
            x - img.width / 2,
            y - img.height / 2,
            brushSize.value,
            brushSize.value
          );
        }

        lastX = x;
        lastY = y;
      }

      function stopPainting() {
        painting = false;
      }

      function clearCanvas() {
        paintCtx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
      }
      function undoLastStroke() {
        if (historyStack.length)
          paintCtx.putImageData(historyStack.pop(), 0, 0);
      }

      function savePainting() {
        const name =
          document.getElementById("paintingName").value || "Untitled";
        const option = document.createElement("option");
        option.value = paintCanvas.toDataURL();
        option.text = name;
        paintingList.add(option);
        paintingList.style.display = "inline-block";
      }

      function loadSelectedPainting() {
        const dataURL = paintingList.value;
        if (!dataURL) return;
        const img = new Image();
        img.onload = () =>
          paintCtx.drawImage(img, 0, 0, paintCanvas.width, paintCanvas.height);
        img.src = dataURL;
      }

      function downloadCanvas() {
        const link = document.createElement("a");
        link.download = "painting.png";
        link.href = paintCanvas.toDataURL();
        link.click();
      }

      paintCanvas.addEventListener("mousedown", startPainting);
      paintCanvas.addEventListener("touchstart", startPainting);
      paintCanvas.addEventListener("mousemove", draw);
      paintCanvas.addEventListener("touchmove", draw);
      paintCanvas.addEventListener("mouseup", stopPainting);
      paintCanvas.addEventListener("mouseleave", stopPainting);
      paintCanvas.addEventListener("touchend", stopPainting);

      resizeCanvases();

      const brushTypeLabel = document.getElementById("brushTypeLabel");
      const brushType = document.getElementById("brushType");

      brushTypeLabel.addEventListener("click", () => {
        if (brushType.style.display === "inline-block") {
          brushType.style.display = "none";
        } else {
          brushType.style.display = "inline-block";
        }
      });
    </script>
  </body>
</html>
