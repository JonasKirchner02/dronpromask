<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="https://use.typekit.net/dfq5tse.css" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      @media only screen and (orientation: landscape) and (max-width: 1366px) and (pointer: coarse) {
        body {
          overflow: hidden;
          height: 100vh;
        }
        body::before {
          content: "Please rotate your device";
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          color: #00ffff;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: clamp(18px, 3.5vw, 40px);
          text-align: center;
          z-index: 999999;
          background: #000064;
        }
      }

      body {
        font-family: "indivisible", sans-serif;
        font-weight: 500;
        font-style: normal;
        margin: 0;
        padding: 2vh;
        padding-left: 6rem;
        padding-right: 6rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background-color: #00ffff;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(10, auto);
        gap: 1vw;
        justify-content: center;
        padding-left: 1rem;
        padding-right: 1rem;
      }

      @media only screen and (max-width: 768px) {
        .controls {
          grid-template-columns: repeat(3, 1fr);
          gap: 2vw;
          padding-left: 5vw;
          padding-right: 5vw;
        }
      }

      label,
      button,
      select,
      input,
      input[type="text"],
      input[type="color"],
      input[type="range"],
      #paintingList {
        background-color: #2626ff;
        color: #ffffff;
        border: none;
        border-radius: clamp(6px, 0.6vw, 12px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: clamp(4px, 0.4vw, 8px) clamp(6px, 0.6vw, 12px);
        font-size: clamp(12px, 0.9vw, 16px);
        font-family: "indivisible", sans-serif;
        font-weight: 500;
        font-style: normal;
      }
      @media (max-width: 768px) {
        label,
        button,
        select,
        input,
        input[type="text"],
        input[type="color"],
        input[type="range"],
        #paintingList {
          padding: clamp(2px, 0.2vw, 4px) clamp(3px, 3vw, 6px);
          font-size: clamp(10px, 1vw, 12px);
        }
      }
      label:hover,
      button:hover,
      select:hover,
      input:hover,
      input[type="text"]:hover,
      input[type="color"]:hover,
      input[type="range"]:hover,
      #paintingList:hover {
        background-color: #000064;
        cursor: pointer;
      }

      .canvas-container {
        position: relative;
        width: 35vw;
        aspect-ratio: 1 / 1;
        transform: translateY(2%);
        padding: 2%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      @media only screen and (max-width: 1366px) {
        .canvas-container {
          width: 80vw;
          aspect-ratio: 1 / 1;
          transform: translateY(15%);
        }
      }

      canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      input::placeholder {
        color: #ffffff;
        opacity: 1;
      }

      canvas#backgroundCanvas {
        z-index: 1;
      }
      canvas#paintCanvas {
        z-index: 2;
      }
      canvas#effectCanvas {
        z-index: 3;
        pointer-events: none;
      }

      @font-face {
        font-family: "Rapid";
        src: url("C:/Users/kirch/OneDrive - VUT/Plocha/DronPro/my-ar-project/fonts/RapidVariableSt.ttf")
          format("truetype");
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <label
        >Color: <input type="color" id="colorPicker" value="#000000"
      /></label>
      <label>
        Brush type:
        <select id="brushType">
          <option value="classic">Classic</option>
          <option value="soft">Softer</option>
          <option value="image1">Image brush 1</option>
          <option value="image2">Image brush 2</option>
        </select>
      </label>
      <label>
        Brush size:
        <input type="range" id="brushSize" min="5" max="150" value="5" />
      </label>
      <label>
        Soft steps:
        <input type="range" id="softSteps" min="1" max="50" value="10" />
      </label>
      <button onclick="clearCanvas()">Clear</button>
      <button onclick="undoLastStroke()">Undo</button>
      <input type="text" id="paintingName" placeholder="Enter name:" />
      <button onclick="savePainting()">Save painting</button>
      <select id="paintingList" onchange="loadSelectedPainting()">
        <option value="">My paintings</option>
      </select>
      <button onclick="downloadCanvas()">Download PNG</button>
    </div>

    <button
      onclick="saveCanvasAndGo()"
      style="
        margin-top: 2vh;
        padding: clamp 4px, 0.4vw, 8px clamp 6px, 0.6vw, 12px;
      "
    >
      <img
        src="./Apply2.svg"
        alt="Apply"
        style="
          width: 15vw;
          height: auto;
          max-width: 200px;
          padding: clamp 8px, 0.8vw, 8px clamp 12px, 1.2vw, 12px;
        "
      />
    </button>

    <div class="canvas-container">
      <canvas id="backgroundCanvas"></canvas>
      <canvas id="paintCanvas"></canvas>
      <canvas id="effectCanvas"></canvas>
    </div>

    <script>
      // All JavaScript remains exactly the same
    </script>
  </body>
</html>
