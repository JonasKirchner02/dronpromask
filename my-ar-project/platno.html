<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="https://use.typekit.net/dfq5tse.css" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      @media only screen and (orientation: landscape) and (max-width: 1366px) and (pointer: coarse) {
        body {
          overflow: hidden;
          height: 100vh;
        }
        body::before {
          content: "Please rotate your device";
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          color: #00ffff;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: clamp(18px, 3.5vw, 40px);
          text-align: center;
          z-index: 999999;
          background: #000064;
        }
      }

      /* Reset & fonts */
      body {
        font-family: "indivisible", sans-serif;
        font-weight: 500;
        font-style: normal;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 2vh;
        background: url("file3.png") no-repeat center center fixed;
        background-size: cover;
        background-color: #262be8;
      }

      /* Controls row - always one line, scale to fit, with left/right padding */
      .controls {
        display: flex;
        flex-wrap: nowrap; /* stay in one line */
        justify-content: center;
        align-items: center;
        gap: 0.5vw;
        width: 100%;
        margin: 1rem auto;
        padding: 0 1rem; /* left and right padding */
        box-sizing: border-box;
      }

      /* Each control element scales */
      .controls > * {
        flex: 1 1 0; /* shrink to fit, grow if space */
        min-width: 0; /* allow shrinking below original size */
        max-width: 100%; /* never exceed container width */
      }

      /* Labels, buttons, inputs, select */
      label,
      button,
      select,
      input[type="text"],
      #paintingList {
        background-color: #2626ff;
        color: #ffffff;
        border: none;
        border-radius: clamp(6px, 0.6vw, 10px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: clamp(0.3rem, 0.8vw, 0.5rem);
        font-size: clamp(0.6rem, 1vw, 1rem);
        white-space: nowrap;
        text-overflow: ellipsis;
        text-align: center;
        box-sizing: border-box;
        cursor: pointer;
        overflow: hidden;
      }

      /* Labels */
      label {
        display: flex;
        align-items: center;
        gap: 0.3rem;
      }

      /* Hidden color input */
      label.color-label {
        justify-content: center;
        position: relative;
      }
      label.color-label input[type="color"] {
        position: absolute;
        border: none;
        opacity: 0;
        pointer-events: none;
      }

      /* Range styling */
      label input[type="range"] {
        flex: 1;
        min-width: 0;
        max-width: 100%;
        margin-left: 0.3rem;
        height: 4px;
        background: #af32ff;
        border-radius: 6px;
        -webkit-appearance: none;
      }

      select {
        -webkit-appearance: none;
      }

      label input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 12px;
        height: 12px;
        background: #00ffff;
        border-radius: 50%;
        cursor: pointer;
      }
      label input[type="range"]::-moz-range-thumb {
        width: 12px;
        height: 12px;
        background: #00ffff;
        border-radius: 50%;
        cursor: pointer;
      }

      /* Hover effect */
      label:hover,
      button:hover,
      select:hover,
      input:hover,
      input[type="text"]:hover,
      #paintingList:hover {
        background-color: #000064;
      }

      /* Canvas container */
      .canvas-container {
        position: relative;
        width: min(80vw, 80vh);
        aspect-ratio: 1 / 1;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* Apply button */
      .apply-button {
        border: none;
        cursor: pointer;
        border-radius: clamp(4px, 0.4vw, 6px);
        padding: 1rem;
        margin: 1rem 0;
      }
      .apply-button img {
        width: clamp(40px, 6vw, 100px);
        height: auto;
      }

      /* Canvas layers */
      canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      canvas#backgroundCanvas {
        z-index: 1;
      }
      canvas#paintCanvas {
        z-index: 2;
      }
      canvas#effectCanvas {
        z-index: 3;
        pointer-events: none;
      }

      /* Custom font */
      @font-face {
        font-family: "Rapid";
        src: url("C:/Users/kirch/OneDrive - VUT/Plocha/DronPro/my-ar-project/fonts/RapidVariableSt.ttf")
          format("truetype");
      }

      ::placeholder {
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <label class="color-label"
        >Color<input type="color" id="colorPicker" value="#000000"
      /></label>

      <select id="brushType">
        <option value="classic">Brush Type</option>
        <option value="classic">Classic</option>
        <option value="soft">Softer</option>
        <option value="image1">Image 1</option>
        <option value="image2">Image 2</option>
      </select>

      <label>
        Brush size
        <input type="range" id="brushSize" min="5" max="150" value="5" />
      </label>
      <label>
        Soft steps
        <input type="range" id="softSteps" min="1" max="50" value="10" />
      </label>
      <button onclick="clearCanvas()">Clear</button>
      <button onclick="undoLastStroke()">Undo</button>
      <input type="text" id="paintingName" placeholder="Enter name" />
      <button onclick="savePainting()">Save painting</button>
      <select id="paintingList" onchange="loadSelectedPainting()">
        <option value="">My paintings</option>
      </select>
      <button onclick="downloadCanvas()">Download PNG</button>
    </div>

    <div class="canvas-container">
      <canvas id="backgroundCanvas"></canvas>
      <canvas id="paintCanvas"></canvas>
      <canvas id="effectCanvas"></canvas>
    </div>

    <button onclick="saveCanvasAndGo()" class="apply-button">
      <img src="./Apply4.svg" />
    </button>

    <script>
      let historyStack = [];
      const maxHistory = 50;
      let lastX = 0,
        lastY = 0;
      let painting = false;

      const paintCanvas = document.getElementById("paintCanvas");
      const paintCtx = paintCanvas.getContext("2d");
      const bgCanvas = document.getElementById("backgroundCanvas");
      const bgCtx = bgCanvas.getContext("2d");
      const effectCanvas = document.getElementById("effectCanvas");
      const effectCtx = effectCanvas.getContext("2d");

      const colorPicker = document.getElementById("colorPicker");
      const brushSize = document.getElementById("brushSize");
      const softSteps = document.getElementById("softSteps");
      const brushType = document.getElementById("brushType");

      let brushImage1 = new Image();
      brushImage1.src = "/supina.png";

      let brushImage2 = new Image();
      brushImage2.src = "/supina2.png";

      const bgImage = new Image();
      bgImage.src = "/uvmapka.png";

      const effectImage = new Image();
      effectImage.src = "/overlinky7.png";

      // fixed high-res paint buffer
      paintCanvas.width = 1024;
      paintCanvas.height = 1024;

      function resizeCanvases() {
        const container = document.querySelector(".canvas-container");
        const rect = container.getBoundingClientRect();

        bgCanvas.width = rect.width;
        bgCanvas.height = rect.height;
        effectCanvas.width = rect.width;
        effectCanvas.height = rect.height;

        bgCtx.drawImage(bgImage, 0, 0, rect.width, rect.height);
        drawEffect();
      }

      function drawEffect() {
        effectCtx.clearRect(0, 0, effectCanvas.width, effectCanvas.height);
        effectCtx.drawImage(
          effectImage,
          0,
          0,
          effectCanvas.width,
          effectCanvas.height
        );
      }

      window.addEventListener("resize", resizeCanvases);
      bgImage.onload = () => resizeCanvases();
      effectImage.onload = drawEffect;

      function getCoordinates(e) {
        const rect = paintCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        const scaleX = paintCanvas.width / rect.width;
        const scaleY = paintCanvas.height / rect.height;

        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY,
        };
      }

      function saveToHistory() {
        if (historyStack.length >= maxHistory) historyStack.shift();
        historyStack.push(
          paintCtx.getImageData(0, 0, paintCanvas.width, paintCanvas.height)
        );
      }

      function startPainting(e) {
        saveToHistory();
        painting = true;
        const { x, y } = getCoordinates(e);
        lastX = x;
        lastY = y;
      }

      function draw(e) {
        if (!painting) return;
        e.preventDefault();
        const { x, y } = getCoordinates(e);
        const mirrorX = paintCanvas.width - x;

        paintCtx.lineCap = "round";
        paintCtx.strokeStyle = colorPicker.value;

        if (brushType.value === "classic") {
          paintCtx.lineWidth = brushSize.value;
          paintCtx.beginPath();
          paintCtx.moveTo(lastX, lastY);
          paintCtx.lineTo(x, y);
          paintCtx.stroke();

          paintCtx.beginPath();
          paintCtx.moveTo(paintCanvas.width - lastX, lastY);
          paintCtx.lineTo(mirrorX, y);
          paintCtx.stroke();
        } else if (brushType.value === "soft") {
          const steps = parseInt(softSteps.value);
          for (let i = 0; i < steps; i++) {
            const t = i / steps;
            const ix = lastX + (x - lastX) * t;
            const iy = lastY + (y - lastY) * t;
            const mirrorIX = paintCanvas.width - ix;
            const radius = brushSize.value * (1 - t * 0.8);

            paintCtx.globalAlpha = 0.15;
            paintCtx.beginPath();
            paintCtx.arc(ix, iy, radius / 2, 0, Math.PI * 2);
            paintCtx.fillStyle = colorPicker.value;
            paintCtx.fill();

            paintCtx.beginPath();
            paintCtx.arc(mirrorIX, iy, radius / 2, 0, Math.PI * 2);
            paintCtx.fillStyle = colorPicker.value;
            paintCtx.fill();
          }
          paintCtx.globalAlpha = 1;
        } else if (brushType.value === "image1") {
          const w = brushSize.value;
          const h = brushSize.value;
          paintCtx.drawImage(brushImage1, x - w / 2, y - h / 2, w, h);
          paintCtx.drawImage(brushImage1, mirrorX - w / 2, y - h / 2, w, h);
        } else if (brushType.value === "image2") {
          const w = brushSize.value;
          const h = brushSize.value;
          paintCtx.drawImage(brushImage2, x - w / 2, y - h / 2, w, h);
          paintCtx.drawImage(brushImage2, mirrorX - w / 2, y - h / 2, w, h);
        }

        lastX = x;
        lastY = y;
      }

      function endPainting() {
        painting = false;
        paintCtx.beginPath();
        paintCtx.globalAlpha = 1;
        localStorage.setItem("lastPainting", paintCanvas.toDataURL());
      }

      function undoLastStroke() {
        if (historyStack.length > 0) {
          const imgData = historyStack.pop();
          paintCtx.putImageData(imgData, 0, 0);
        }
      }

      function clearCanvas() {
        saveToHistory();
        paintCtx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
      }

      function savePainting() {
        const name = document.getElementById("paintingName").value.trim();
        if (!name) return alert("Enter a name!");
        const dataURL = paintCanvas.toDataURL();
        localStorage.setItem(`painting_${name}`, dataURL);

        const paintingList = document.getElementById("paintingList");
        if (![...paintingList.options].some((o) => o.value === name)) {
          const option = document.createElement("option");
          option.value = name;
          option.textContent = name;
          paintingList.appendChild(option);
        }
      }

      function loadSelectedPainting() {
        const select = document.getElementById("paintingList");
        const name = select.value;
        if (!name) return;
        const dataURL = localStorage.getItem(`painting_${name}`);
        if (!dataURL) return;

        const img = new Image();
        img.onload = () => {
          paintCtx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
          paintCtx.drawImage(img, 0, 0, paintCanvas.width, paintCanvas.height);
        };
        img.src = dataURL;
      }

      function saveCanvasAndGo() {
        const finalImage = paintCanvas.toDataURL();
        localStorage.setItem("customMaskTexture", finalImage);
        window.location.href = "index.html";
      }

      function downloadCanvas() {
        const tempCanvas = document.createElement("canvas");
        tempCanvas.width = paintCanvas.width;
        tempCanvas.height = paintCanvas.height;
        const tempCtx = tempCanvas.getContext("2d");
        tempCtx.drawImage(bgCanvas, 0, 0, tempCanvas.width, tempCanvas.height);
        tempCtx.drawImage(paintCanvas, 0, 0);

        tempCanvas.toBlob(function (blob) {
          const link = document.createElement("a");
          link.download =
            (document.getElementById("paintingName").value.trim() || "") +
            ".png";
          link.href = URL.createObjectURL(blob);
          link.click();
          URL.revokeObjectURL(link.href);
        });
      }

      paintCanvas.addEventListener("mousedown", startPainting);
      paintCanvas.addEventListener("touchstart", startPainting);
      paintCanvas.addEventListener("mousemove", draw);
      paintCanvas.addEventListener("touchmove", draw);
      paintCanvas.addEventListener("mouseup", endPainting);
      paintCanvas.addEventListener("mouseleave", endPainting);
      paintCanvas.addEventListener("touchend", endPainting);

      window.addEventListener("load", () => {
        resizeCanvases();
        const lastPainting = localStorage.getItem("lastPainting");
        if (lastPainting) {
          const img = new Image();
          img.onload = () =>
            paintCtx.drawImage(
              img,
              0,
              0,
              paintCanvas.width,
              paintCanvas.height
            );
          img.src = lastPainting;
        }
        const paintingList = document.getElementById("paintingList");
        for (let key in localStorage) {
          if (key.startsWith("painting_")) {
            const name = key.replace("painting_", "");
            const option = document.createElement("option");
            option.value = name;
            option.textContent = name;
            paintingList.appendChild(option);
          }
        }
      });
    </script>
  </body>
</html>
