<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #00ffff;
      }

      .controls {
        margin-bottom: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      label,
      button,
      select,
      input {
        background-color: #2626ff;
        color: #ffffff;
        border: none;
        border-radius: 10px;
        padding: 3px 6px;
        font-size: 0.8rem;
        cursor: pointer;
      }

      .canvas-container {
        position: relative;
        width: 50vw;
        aspect-ratio: 1/1;
      }

      canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <label
        >Color: <input type="color" id="colorPicker" value="#000000"
      /></label>
      <label
        >Brush type:
        <select id="brushType">
          <option value="classic">Classic</option>
          <option value="soft">Soft</option>
          <option value="image1">Image Brush 1</option>
          <option value="image2">Image Brush 2</option>
        </select>
      </label>
      <label
        >Brush size:
        <input type="range" id="brushSize" min="5" max="150" value="20"
      /></label>
      <label
        >Soft brush steps:
        <input type="range" id="softSteps" min="1" max="50" value="10"
      /></label>
      <button onclick="clearCanvas()">Clear</button>
    </div>

    <div class="canvas-container">
      <canvas id="paintCanvas"></canvas>
    </div>

    <script>
      const paintCanvas = document.getElementById("paintCanvas");
      const ctx = paintCanvas.getContext("2d");

      let painting = false;
      let lastX = 0,
        lastY = 0;

      const colorPicker = document.getElementById("colorPicker");
      const brushSize = document.getElementById("brushSize");
      const softSteps = document.getElementById("softSteps");
      const brushType = document.getElementById("brushType");

      const imageBrush1 = new Image();
      imageBrush1.src = "/supina.png";

      const imageBrush2 = new Image();
      imageBrush2.src = "/supina2.png";

      function resizeCanvas() {
        paintCanvas.width = paintCanvas.offsetWidth;
        paintCanvas.height = paintCanvas.offsetHeight;
      }
      window.addEventListener("resize", resizeCanvas);
      window.addEventListener("load", resizeCanvas);

      function getCoordinates(e) {
        const rect = paintCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      }

      function startPainting(e) {
        painting = true;
        const { x, y } = getCoordinates(e);
        lastX = x;
        lastY = y;
      }

      function draw(e) {
        if (!painting) return;
        e.preventDefault();
        const { x, y } = getCoordinates(e);

        if (brushType.value === "classic") {
          ctx.strokeStyle = colorPicker.value;
          ctx.lineWidth = brushSize.value;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(lastX, lastY);
          ctx.lineTo(x, y);
          ctx.stroke();
        } else if (brushType.value === "soft") {
          const steps = parseInt(softSteps.value);
          for (let i = 0; i < steps; i++) {
            const t = i / steps;
            const ix = lastX + (x - lastX) * t;
            const iy = lastY + (y - lastY) * t;
            const radius = brushSize.value * (1 - t * 0.8);
            ctx.globalAlpha = 0.15;
            ctx.beginPath();
            ctx.arc(ix, iy, radius / 2, 0, Math.PI * 2);
            ctx.fillStyle = colorPicker.value;
            ctx.fill();
          }
          ctx.globalAlpha = 1;
        } else if (brushType.value === "image1") {
          const w = brushSize.value,
            h = brushSize.value;
          ctx.drawImage(imageBrush1, x - w / 2, y - h / 2, w, h);
        } else if (brushType.value === "image2") {
          const w = brushSize.value,
            h = brushSize.value;
          ctx.drawImage(imageBrush2, x - w / 2, y - h / 2, w, h);
        }

        lastX = x;
        lastY = y;
      }

      function endPainting() {
        painting = false;
        ctx.beginPath();
      }

      function clearCanvas() {
        ctx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
      }

      paintCanvas.addEventListener("mousedown", startPainting);
      paintCanvas.addEventListener("touchstart", startPainting);
      paintCanvas.addEventListener("mousemove", draw);
      paintCanvas.addEventListener("touchmove", draw);
      paintCanvas.addEventListener("mouseup", endPainting);
      paintCanvas.addEventListener("mouseleave", endPainting);
      paintCanvas.addEventListener("touchend", endPainting);
    </script>
  </body>
</html>
