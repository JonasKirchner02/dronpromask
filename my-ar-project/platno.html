<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Soft Brush Painting</title>

    <style>
      @font-face {
        font-family: "MyFont";
        src: url("fonts/RapidVariableSt.ttf") format("truetype");
      }

      body {
        font-family: "MyFont", sans-serif;
        font-style: normal;
        font-variation-settings: "wdth" 100, "wght" 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0;
        padding: 20px;
        justify-content: center;
        overflow: hidden;
        font-size: 0.9rem;
        background-color: #00ffff;
      }

      @media only screen and (orientation: landscape) and (max-width: 1366px) and (pointer: coarse) {
        body {
          overflow: hidden;
          height: 100vh;
        }
        body::before {
          content: "Please rotate your device";
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          color: #00ffff;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 3.64rem;
          text-align: center;
          z-index: 999999;
          background: #000064;
          font-family: "MyFont", sans-serif;
        }
      }

      .controls {
        margin-bottom: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      label,
      button,
      select,
      input {
        background-color: #2626ff;
        color: #00ffff;
        border: none;
        border-radius: 4px;
        font-family: "MyFont", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3px 6px;
      }

      input::placeholder {
        color: #00ffff;
        opacity: 1;
      }

      .canvas-container {
        position: relative;
        width: 35vw;
        aspect-ratio: 1 / 1;
        border: 1px solid #ccc;
        display: flex;
        justify-content: center;
        align-items: center;
        transform: translateY(4%);
        padding: 2%;
      }

      @media only screen and (max-width: 1366px) {
        .canvas-container {
          width: 80vw;
          aspect-ratio: 1 / 1;
          transform: translateY(15%);
        }
      }

      canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      canvas#backgroundCanvas {
        z-index: 1;
      }
      canvas#effectCanvas {
        z-index: 3;
        pointer-events: none;
      }
      canvas#paintCanvas {
        z-index: 2;
      }
    </style>
  </head>

  <body>
    <div class="controls">
      <label
        >COLOR: <input type="color" id="colorPicker" value="#000000"
      /></label>
      <label
        >BRUSH TYPE:
        <select id="brushType">
          <option value="classic">CLASSIC</option>
          <option value="soft">SOFTER</option>
          <option value="image">IMAGE BRUSH</option>
        </select>
      </label>
      <label
        >BRUSH SIZE:
        <input type="range" id="brushSize" min="5" max="150" value="5"
      /></label>
      <label
        >SOFT BRUSH STEPS:
        <input type="range" id="softSteps" min="1" max="50" value="10"
      /></label>

      <label id="imageBrushPicker" style="display: none"
        >BRUSH IMAGE:
        <select id="imageBrushSelect">
          <option value="/supina.png">BRUSH 1</option>
          <option value="/supina2.png">BRUSH 2</option>
        </select>
      </label>

      <button onclick="clearCanvas()">CLEAR</button>
      <button onclick="undoLastStroke()">UNDO</button>
      <input type="text" id="paintingName" placeholder="ENTER NAME:" />
      <button onclick="savePainting()">SAVE PAINTING</button>
      <select id="paintingList" onchange="loadSelectedPainting()">
        <option value="">MY PAINTINGS</option>
      </select>
    </div>

    <button onclick="saveCanvasAndGo()">APPLY TO MY OWN MASK</button>

    <div class="canvas-container">
      <canvas id="backgroundCanvas"></canvas>
      <canvas id="effectCanvas"></canvas>
      <canvas id="paintCanvas"></canvas>
    </div>

    <script>
      let historyStack = [];
      const maxHistory = 50;
      let lastX = 0,
        lastY = 0;
      let scaleX = 1,
        scaleY = 1;
      const paintCanvas = document.getElementById("paintCanvas");
      const paintCtx = paintCanvas.getContext("2d");
      const bgCanvas = document.getElementById("backgroundCanvas");
      const bgCtx = bgCanvas.getContext("2d");
      const effectCanvas = document.getElementById("effectCanvas");
      const effectCtx = effectCanvas.getContext("2d");

      const colorPicker = document.getElementById("colorPicker");
      const brushSize = document.getElementById("brushSize");
      const softSteps = document.getElementById("softSteps");
      const brushType = document.getElementById("brushType");
      const imageBrushPicker = document.getElementById("imageBrushPicker");
      const imageBrushSelect = document.getElementById("imageBrushSelect");
      let brushImage = new Image();
      brushImage.src = imageBrushSelect.value;

      brushType.addEventListener("change", () => {
        imageBrushPicker.style.display =
          brushType.value === "image" ? "inline" : "none";
      });
      imageBrushSelect.addEventListener("change", () => {
        brushImage.src = imageBrushSelect.value;
      });

      const bgImage = new Image();
      bgImage.src = "/UV212.png";
      const effectImage = new Image();
      effectImage.src = "/overlinky.png";

      function resizeCanvases() {
        const container = document.querySelector(".canvas-container");
        const rect = container.getBoundingClientRect();
        [paintCanvas, bgCanvas, effectCanvas].forEach((c) => {
          c.width = rect.width;
          c.height = rect.height;
        });
        scaleX = paintCanvas.width / rect.width;
        scaleY = paintCanvas.height / rect.height;
        if (bgImage.complete)
          bgCtx.drawImage(bgImage, 0, 0, paintCanvas.width, paintCanvas.height);
        if (effectImage.complete)
          effectCtx.drawImage(
            effectImage,
            0,
            0,
            paintCanvas.width,
            paintCanvas.height
          );
      }

      bgImage.onload = effectImage.onload = resizeCanvases;
      window.addEventListener("resize", resizeCanvases);

      function getCoordinates(e) {
        const rect = paintCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY,
        };
      }

      function saveToHistory() {
        if (historyStack.length >= maxHistory) historyStack.shift();
        historyStack.push(
          paintCtx.getImageData(0, 0, paintCanvas.width, paintCanvas.height)
        );
      }

      function startPainting(e) {
        saveToHistory();
        painting = true;
        const { x, y } = getCoordinates(e);
        lastX = x;
        lastY = y;
      }
      function endPainting() {
        painting = false;
        paintCtx.beginPath();
      }
      function undoLastStroke() {
        if (historyStack.length)
          paintCtx.putImageData(historyStack.pop(), 0, 0);
      }
      function draw(e) {
        if (!painting) return;
        e.preventDefault();
        const { x, y } = getCoordinates(e);
        const mirrorX = paintCanvas.width - x;

        if (brushType.value === "classic") {
          paintCtx.lineWidth = brushSize.value;
          paintCtx.strokeStyle = colorPicker.value;
          paintCtx.lineCap = "round";
          paintCtx.beginPath();
          paintCtx.moveTo(lastX, lastY);
          paintCtx.lineTo(x, y);
          paintCtx.stroke();
          paintCtx.beginPath();
          paintCtx.moveTo(paintCanvas.width - lastX, lastY);
          paintCtx.lineTo(mirrorX, y);
          paintCtx.stroke();
        } else if (brushType.value === "soft") {
          const steps = parseInt(softSteps.value);
          for (let i = 0; i < steps; i++) {
            const t = i / steps;
            const ix = lastX + (x - lastX) * t;
            const iy = lastY + (y - lastY) * t;
            const mirrorIX = paintCanvas.width - ix;
            paintCtx.beginPath();
            paintCtx.arc(ix, iy, brushSize.value / 2, 0, Math.PI * 2);
            paintCtx.fillStyle = colorPicker.value;
            paintCtx.fill();
            paintCtx.beginPath();
            paintCtx.arc(mirrorIX, iy, brushSize.value / 2, 0, Math.PI * 2);
            paintCtx.fillStyle = colorPicker.value;
            paintCtx.fill();
          }
        } else if (brushType.value === "image") {
          const w = brushSize.value,
            h = brushSize.value;
          paintCtx.drawImage(brushImage, x - w / 2, y - h / 2, w, h);
          paintCtx.drawImage(brushImage, mirrorX - w / 2, y - h / 2, w, h);
        }

        lastX = x;
        lastY = y;
      }

      paintCanvas.addEventListener("mousedown", startPainting);
      paintCanvas.addEventListener("touchstart", startPainting);
      paintCanvas.addEventListener("mousemove", draw);
      paintCanvas.addEventListener("touchmove", draw);
      paintCanvas.addEventListener("mouseup", endPainting);
      paintCanvas.addEventListener("touchend", endPainting);
      paintCanvas.addEventListener("mouseout", endPainting);

      function clearCanvas() {
        saveToHistory();
        paintCtx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
      }
      function savePainting() {
        const name = document.getElementById("paintingName").value.trim();
        if (!name) return alert("Enter a name");
        localStorage.setItem(`painting-${name}`, paintCanvas.toDataURL());
        updatePaintingList();
      }
      function updatePaintingList() {
        const list = document.getElementById("paintingList");
        list.innerHTML = '<option value="">MY PAINTINGS</option>';
        Object.keys(localStorage).forEach((key) => {
          if (key.startsWith("painting-")) {
            const val = key.replace("painting-", "");
            list.innerHTML += `<option value="${key}">${val}</option>`;
          }
        });
      }
      function loadSelectedPainting() {
        const list = document.getElementById("paintingList");
        const key = list.value;
        if (!key) return;
        const img = new Image();
        img.onload = () =>
          paintCtx.drawImage(img, 0, 0, paintCanvas.width, paintCanvas.height);
        img.src = localStorage.getItem(key);
      }

      function saveCanvasAndGo() {
        const link = document.createElement("a");
        link.download = "my_mask.png";
        link.href = paintCanvas.toDataURL();
        link.click();
      }

      updatePaintingList();
      let painting = false;
    </script>
  </body>
</html>
