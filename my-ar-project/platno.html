<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="https://use.typekit.net/dfq5tse.css" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      @media only screen and (orientation: landscape) and (max-width: 1366px) and (pointer: coarse) {
        body {
          overflow: hidden;
          height: 100vh;
        }
        body::before {
          content: "Please rotate your device";
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          color: #00ffff;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: clamp(18px, 3.5vw, 40px);
          text-align: center;
          z-index: 999999;
          background: #000064;
        }
      }

      body {
        font-family: "indivisible", sans-serif;
        font-weight: 500;
        font-style: normal;
        margin: 0;
        padding: 2vh 6rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background-color: #00ffff;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(10, auto);
        gap: 1vw;
        justify-content: center;
        padding: 0 1rem;
        white-space: nowrap;
      }

      label,
      button,
      select,
      input,
      input[type="text"],
      input[type="color"],
      input[type="range"],
      #paintingList {
        background-color: #2626ff;
        color: #ffffff;
        border: none;
        border-radius: clamp(6px, 0.6vw, 12px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: clamp(4px, 0.4vw, 8px) clamp(6px, 0.6vw, 12px);
        font-size: clamp(12px, 0.9vw, 16px);
        font-family: "indivisible", sans-serif;
        font-weight: 500;
        white-space: nowrap;
        text-overflow: ellipsis;
        overflow: hidden;
      }

      @media only screen and (max-width: 768px) {
        .controls {
          grid-template-columns: repeat(1, auto);
          gap: 0.1rem;
          padding: 0.2rem;
        }

        label,
        button,
        select,
        input,
        #paintingList {
          padding: 0.3rem 0.5rem;
          font-size: 0.8rem;
          width: 90vw;
          justify-content: center;
        }
      }

      label:hover,
      button:hover,
      select:hover,
      input:hover,
      #paintingList:hover {
        background-color: #000064;
        cursor: pointer;
      }

      .canvas-container {
        position: relative;
        width: 35vw;
        aspect-ratio: 1 / 1;
        transform: translateY(2%);
        padding: 2%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      @media only screen and (max-width: 1366px) {
        .canvas-container {
          width: 80vw;
          transform: translateY(0%);
        }
      }

      input[type="range"] {
        -webkit-appearance: none;
        height: 1px;
        background: #af32ff;
        border-radius: 6px;
        outline: #ffff00;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 12px;
        height: 12px;
        background: #00ffff;
        border-radius: 50%;
        cursor: pointer;
      }

      canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      input::placeholder {
        color: #ffffff;
        opacity: 1;
      }

      canvas#backgroundCanvas {
        z-index: 1;
      }
      canvas#paintCanvas {
        z-index: 2;
      }
      canvas#effectCanvas {
        z-index: 3;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <label
        >Color: <input type="color" id="colorPicker" value="#000000"
      /></label>
      <label>
        Brush type:
        <select id="brushType">
          <option value="classic">Classic</option>
          <option value="soft">Soft</option>
          <option value="image1">Image brush 1</option>
          <option value="image2">Image brush 2</option>
        </select>
      </label>
      <label
        >Brush size:
        <input type="range" id="brushSize" min="5" max="150" value="5"
      /></label>
      <label
        >Soft steps:
        <input type="range" id="softSteps" min="1" max="50" value="10"
      /></label>
      <button onclick="clearCanvas()">Clear</button>
      <button onclick="undoLastStroke()">Undo</button>
      <input type="text" id="paintingName" placeholder="Enter name:" />
      <button onclick="savePainting()">Save painting</button>
      <select id="paintingList" onchange="loadSelectedPainting()">
        <option value="">My paintings</option>
      </select>
      <button onclick="downloadCanvas()">Download PNG</button>
    </div>

    <div class="canvas-container">
      <canvas id="backgroundCanvas"></canvas>
      <canvas id="paintCanvas"></canvas>
      <canvas id="effectCanvas"></canvas>
    </div>

    <script>
      let historyStack = [];
      const maxHistory = 50;
      let painting = false;
      let lastX = 0,
        lastY = 0;

      const paintCanvas = document.getElementById("paintCanvas");
      const paintCtx = paintCanvas.getContext("2d");
      const bgCanvas = document.getElementById("backgroundCanvas");
      const bgCtx = bgCanvas.getContext("2d");
      const effectCanvas = document.getElementById("effectCanvas");
      const effectCtx = effectCanvas.getContext("2d");

      const colorPicker = document.getElementById("colorPicker");
      const brushSize = document.getElementById("brushSize");
      const softSteps = document.getElementById("softSteps");
      const brushType = document.getElementById("brushType");

      const brushImage1 = new Image();
      brushImage1.src = "/supina.png";
      const brushImage2 = new Image();
      brushImage2.src = "/supina2.png";

      const bgImage = new Image();
      bgImage.src = "/UVtransparent.png";
      const effectImage = new Image();
      effectImage.src = "/overlinky.png";

      function resizeCanvases() {
        const container = document.querySelector(".canvas-container");
        const rect = container.getBoundingClientRect();

        const oldPaint = document.createElement("canvas");
        oldPaint.width = paintCanvas.width;
        oldPaint.height = paintCanvas.height;
        oldPaint.getContext("2d").drawImage(paintCanvas, 0, 0);

        [paintCanvas, bgCanvas, effectCanvas].forEach((c) => {
          c.width = rect.width;
          c.height = rect.height;
        });

        paintCtx.drawImage(oldPaint, 0, 0, rect.width, rect.height);
        bgCtx.drawImage(bgImage, 0, 0, rect.width, rect.height);
        drawEffect();
      }

      function drawEffect() {
        effectCtx.clearRect(0, 0, effectCanvas.width, effectCanvas.height);
        effectCtx.drawImage(
          effectImage,
          0,
          0,
          effectCanvas.width,
          effectCanvas.height
        );
      }

      function getCoordinates(e) {
        const rect = paintCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      }

      function saveToHistory() {
        if (historyStack.length >= maxHistory) historyStack.shift();
        historyStack.push(
          paintCtx.getImageData(0, 0, paintCanvas.width, paintCanvas.height)
        );
      }

      function startPainting(e) {
        saveToHistory();
        painting = true;
        const { x, y } = getCoordinates(e);
        lastX = x;
        lastY = y;
      }

      function draw(e) {
        if (!painting) return;
        e.preventDefault();
        const { x, y } = getCoordinates(e);
        const mirrorX = paintCanvas.width - x;

        paintCtx.strokeStyle = colorPicker.value;
        paintCtx.lineWidth = brushSize.value;
        paintCtx.lineCap = "round";

        if (brushType.value === "classic" || brushType.value === "soft") {
          const steps = brushType.value === "soft" ? softSteps.value : 1;
          for (let i = 0; i < steps; i++) {
            const t = i / steps;
            paintCtx.beginPath();
            paintCtx.moveTo(lastX * (1 - t) + x * t, lastY * (1 - t) + y * t);
            paintCtx.lineTo(lastX * (1 - t) + x * t, lastY * (1 - t) + y * t);
            paintCtx.stroke();
          }
        } else {
          const img = brushType.value === "image1" ? brushImage1 : brushImage2;
          paintCtx.drawImage(
            img,
            x - img.width / 2,
            y - img.height / 2,
            brushSize.value,
            brushSize.value
          );
        }

        lastX = x;
        lastY = y;
      }

      function stopPainting() {
        painting = false;
      }

      function clearCanvas() {
        paintCtx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
      }

      function undoLastStroke() {
        if (historyStack.length) {
          paintCtx.putImageData(historyStack.pop(), 0, 0);
        }
      }

      function savePainting() {
        const name =
          document.getElementById("paintingName").value ||
          `painting_${Date.now()}`;
        localStorage.setItem(name, paintCanvas.toDataURL());
        const list = document.getElementById("paintingList");
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        list.appendChild(option);
      }

      function loadSelectedPainting() {
        const list = document.getElementById("paintingList");
        const dataUrl = localStorage.getItem(list.value);
        if (dataUrl) {
          const img = new Image();
          img.onload = () => {
            paintCtx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
            paintCtx.drawImage(
              img,
              0,
              0,
              paintCanvas.width,
              paintCanvas.height
            );
          };
          img.src = dataUrl;
        }
      }

      function downloadCanvas() {
        const link = document.createElement("a");
        link.download = "painting.png";
        link.href = paintCanvas.toDataURL();
        link.click();
      }

      window.addEventListener("resize", resizeCanvases);
      window.addEventListener("load", () => {
        resizeCanvases();
        bgImage.onload = () =>
          bgCtx.drawImage(bgImage, 0, 0, bgCanvas.width, bgCanvas.height);
        effectImage.onload = drawEffect;
      });

      paintCanvas.addEventListener("mousedown", startPainting);
      paintCanvas.addEventListener("touchstart", startPainting);

      paintCanvas.addEventListener("mousemove", draw);
      paintCanvas.addEventListener("touchmove", draw);

      paintCanvas.addEventListener("mouseup", stopPainting);
      paintCanvas.addEventListener("touchend", stopPainting);
      paintCanvas.addEventListener("mouseleave", stopPainting);
    </script>
  </body>
</html>
