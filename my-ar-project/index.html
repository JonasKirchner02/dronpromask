<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
    <script src="https://cdn.rawgit.com/donmccurdy/aframe-extras/v5.0.1/dist/aframe-extras.min.js"></script>
    <title>DRON PRO MASK</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      .carousel-wrapper {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 10;
      }
      .ikony img {
        width: 50px;
        margin: 0 5px;
        cursor: pointer;
      }
      #downloadBtn {
        position: absolute;
        top: 10px;
        right: 10px;
        padding: 8px 12px;
        background: #222;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        z-index: 10;
      }
    </style>
  </head>

  <body>
    <div class="carousel-wrapper">
      <div class="ikony">
        <img
          class="obrazky"
          id="img1"
          src="/ikony/basicpodklad.png"
          alt="Green Icon"
        />
        <img
          class="obrazky"
          id="img2"
          src="/ikony/supinypodklad.png"
          alt="Red Icon"
        />
        <img
          class="obrazky"
          id="img3"
          src="/ikony/basicironpodklad.png"
          alt="Blue Icon"
        />
        <img
          class="obrazky"
          id="img4"
          src="/ikony/myownpodklad.png"
          alt="My Own Mask"
        />
        <img
          class="edit-button"
          id="img5"
          src="/ikony/editmyownpod.png"
          alt="Edit Icon"
          onclick="{localStorage.setItem('returnIndex', 3); window.location.href = 'platno.html'}"
        />
      </div>
    </div>

    <button id="downloadBtn">Download Mask PNG</button>

    <div class="example-container">
      <a-scene
        mindar-face
        embedded
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
      >
        <a-assets>
          <a-asset-item
            id="headModel"
            src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/sparkar/headOccluder.glb"
          ></a-asset-item>
          <a-asset-item id="maska1" src="/models/basicmodel.glb"></a-asset-item>
          <a-asset-item id="maska2" src="/models/ironmanweb.glb"></a-asset-item>
          <a-asset-item id="maska3" src="/models/supinky7.glb"></a-asset-item>
          <a-asset-item id="maskaown" src="/models/maskauvs.glb"></a-asset-item>
        </a-assets>

        <a-camera
          look-controls="enabled: false"
          position="0 0 0"
          cursor="rayOrigin: mouse"
          raycaster="objects: .clickable"
        ></a-camera>

        <a-entity mindar-face-target="anchorIndex: 1">
          <a-gltf-model
            id="headModelEntity"
            class="clickable"
            mindar-face-occluder
            position="0 -0.3 0.15"
            rotation="0 0 0"
            scale="1 1 1"
            src="#headModel"
            visible="true"
          ></a-gltf-model>
        </a-entity>

        <a-entity mindar-face-target="anchorIndex: 9">
          <a-gltf-model
            class="maska1-entity"
            src="#maska1"
            visible="true"
            position="0 0.5 0"
            scale="1 1 1"
            rotation="0 0 0"
          ></a-gltf-model>
        </a-entity>

        <a-entity mindar-face-target="anchorIndex: 9">
          <a-gltf-model
            class="maska2-entity"
            src="#maska2"
            visible="false"
            position="0 0.5 0"
            scale="1 1 1"
            rotation="0 0 0"
          ></a-gltf-model>
        </a-entity>

        <a-entity mindar-face-target="anchorIndex: 9">
          <a-gltf-model
            class="maska3-entity"
            src="#maska3"
            visible="false"
            position="0 0.5 0"
            scale="1 1 1"
            rotation="0 0 0"
            metalness="0.2"
          ></a-gltf-model>
        </a-entity>

        <a-entity mindar-face-target="anchorIndex: 9">
          <a-gltf-model
            id="maskaown-entity"
            class="maskaown-entity"
            src="#maskaown"
            visible="false"
            position="0 0.5 0"
            scale="1 1 1"
            rotation="0 0 0"
            material="color: #c2c2c2;"
          ></a-gltf-model>
        </a-entity>
      </a-scene>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const list = ["maska1", "maska3", "maska2", "maskaown"];
        const visibles = [false, false, false, false];
        const allEntities = list.map((item) =>
          document.querySelectorAll("." + item + "-entity")
        );
        let currentIndex = 0;

        let returnIndex = localStorage.getItem("returnIndex");
        if (returnIndex !== null) {
          currentIndex = parseInt(returnIndex, 10);
          localStorage.removeItem("returnIndex");
        }

        function showOnly(index) {
          list.forEach((_, i) => {
            const visible = i === index;
            visibles[i] = visible;
            allEntities[i].forEach((entity) => {
              entity.setAttribute("visible", visible);
              if (visible) {
                entity.removeAttribute("animation-mixer");
                const clipName =
                  list[i] === "maska1"
                    ? "animace zelena"
                    : list[i] === "maska2"
                    ? "animace masky"
                    : list[i] === "maska3"
                    ? "animace cerv"
                    : list[i] === "maskaown"
                    ? "myanimace"
                    : "";
                entity.setAttribute("animation-mixer", {
                  clip: clipName,
                  loop: "once",
                  clampWhenFinished: true,
                });
              }
            });
          });
          currentIndex = index;
          localStorage.setItem("returnIndex", `${index}`);
        }

        showOnly(currentIndex);

        document.querySelector("#img1").addEventListener("click", () => {
          showOnly(0);
        });
        document.querySelector("#img2").addEventListener("click", () => {
          showOnly(1);
        });
        document.querySelector("#img3").addEventListener("click", () => {
          showOnly(2);
        });
        document.querySelector("#img4").addEventListener("click", () => {
          showOnly(3);
        });

        const headModelEntity = document.querySelector("#headModelEntity");
        headModelEntity.addEventListener("click", () => {
          const currentEntities = allEntities[currentIndex];
          currentEntities.forEach((entity) => {
            if (visibles[currentIndex]) {
              entity.removeAttribute("animation-mixer");
              const clipName =
                list[currentIndex] === "maska1"
                  ? "animace zelena"
                  : list[currentIndex] === "maska2"
                  ? "animace masky"
                  : list[currentIndex] === "maska3"
                  ? "animace cerv"
                  : list[currentIndex] === "maskaown"
                  ? "myanimace"
                  : "";
              entity.setAttribute("animation-mixer", {
                clip: clipName,
                loop: "once",
                clampWhenFinished: true,
              });
            }
          });
        });

        let startX = 0;
        let isDragging = false;
        document.body.addEventListener("mousedown", (event) => {
          isDragging = true;
          startX = event.clientX;
        });
        document.body.addEventListener("mousemove", (event) => {
          if (isDragging) {
            const diff = event.clientX - startX;
            if (Math.abs(diff) > 50) {
              currentIndex =
                diff < 0
                  ? (currentIndex + 1) % list.length
                  : (currentIndex - 1 + list.length) % list.length;
              showOnly(currentIndex);
              isDragging = false;
            }
          }
        });
        document.body.addEventListener("mouseup", () => {
          isDragging = false;
        });
        let startTouchX = 0;
        document.body.addEventListener("touchstart", (event) => {
          startTouchX = event.touches[0].clientX;
        });
        document.body.addEventListener("touchmove", (event) => {
          const diff = event.touches[0].clientX - startTouchX;
          if (Math.abs(diff) > 50) {
            currentIndex =
              diff < 0
                ? (currentIndex + 1) % list.length
                : (currentIndex - 1 + list.length) % list.length;
            showOnly(currentIndex);
            startTouchX = event.touches[0].clientX;
          }
        });

        // DOWNLOAD MASK PNG
        document
          .getElementById("downloadBtn")
          .addEventListener("click", async () => {
            const maskEntity = document.getElementById("maskaown-entity");
            if (!maskEntity || !maskEntity.object3D) {
              alert("Mask is not loaded yet!");
              return;
            }

            const maskScene = new THREE.Scene();
            const maskClone = maskEntity.object3D.clone(true);
            maskScene.add(maskClone);

            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(1, 1, 2);
            maskScene.add(light);
            maskScene.add(new THREE.AmbientLight(0xffffff, 0.5));

            const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
            camera.position.set(0, 0, 2);
            camera.lookAt(new THREE.Vector3(0, 0, 0));

            const renderer = new THREE.WebGLRenderer({
              alpha: true,
              preserveDrawingBuffer: true,
            });
            renderer.setSize(512, 512);
            renderer.render(maskScene, camera);

            const dataURL = renderer.domElement.toDataURL("image/png");
            const link = document.createElement("a");
            link.href = dataURL;
            link.download = "maskaown.png";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          });
      });
    </script>
  </body>
</html>
