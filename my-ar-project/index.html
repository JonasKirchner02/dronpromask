<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
    <script src="https://cdn.rawgit.com/donmccurdy/aframe-extras/v5.0.1/dist/aframe-extras.min.js"></script>
    <title>DRON PRO MASK</title>
  </head>

  <body>
    <div class="carousel-wrapper">
      <div class="ikony">
        <img
          class="obrazky"
          id="img1"
          src="/ikony/basicpodklad.png"
          alt="Green Icon"
        />
        <img
          class="obrazky"
          id="img2"
          src="/ikony/supinypodklad.png"
          alt="Red Icon"
        />
        <img
          class="obrazky"
          id="img3"
          src="/ikony/basicironpodklad.png"
          alt="Blue Icon"
        />
        <img
          class="obrazky"
          id="img4"
          src="/ikony/myownpodklad.png"
          alt="My Own Mask"
        />
        <img
          class="edit-button"
          id="img5"
          src="/ikony/editmyownpod.png"
          alt="Edit Icon"
          onclick="localStorage.setItem('returnIndex', 3); window.location.href='platno.html';"
        />
        <button onclick="downloadMaskaown()">Download Mask PNG</button>
      </div>
    </div>

    <div class="example-container">
      <a-scene
        mindar-face
        embedded
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
      >
        <a-assets>
          <a-asset-item
            id="headModel"
            src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/sparkar/headOccluder.glb"
          ></a-asset-item>
          <a-asset-item id="maska1" src="/models/basicmodel.glb"></a-asset-item>
          <a-asset-item id="maska2" src="/models/ironmanweb.glb"></a-asset-item>
          <a-asset-item id="maska3" src="/models/supinky7.glb"></a-asset-item>
          <a-asset-item id="maskaown" src="/models/maskauvs.glb"></a-asset-item>
        </a-assets>

        <a-camera
          look-controls="enabled: false"
          position="0 0 0"
          cursor="rayOrigin: mouse"
          raycaster="objects: .clickable"
        ></a-camera>

        <a-entity mindar-face-target="anchorIndex: 1">
          <a-gltf-model
            id="headModelEntity"
            class="clickable"
            mindar-face-occluder
            position="0 -0.3 0.15"
            rotation="0 0 0"
            scale="1 1 1"
            src="#headModel"
            visible="true"
          ></a-gltf-model>
        </a-entity>

        <a-entity mindar-face-target="anchorIndex: 9">
          <a-gltf-model
            class="maska1-entity"
            src="#maska1"
            visible="true"
            position="0 0.5 0"
            scale="1 1 1"
            rotation="0 0 0"
          ></a-gltf-model>
        </a-entity>
        <a-entity mindar-face-target="anchorIndex: 9">
          <a-gltf-model
            class="maska2-entity"
            src="#maska2"
            visible="false"
            position="0 0.5 0"
            scale="1 1 1"
            rotation="0 0 0"
          ></a-gltf-model>
        </a-entity>
        <a-entity mindar-face-target="anchorIndex: 9">
          <a-gltf-model
            class="maska3-entity"
            src="#maska3"
            visible="false"
            position="0 0.5 0"
            scale="1 1 1"
            rotation="0 0 0"
            metalness="0.2"
          ></a-gltf-model>
        </a-entity>
        <a-entity mindar-face-target="anchorIndex: 9">
          <a-gltf-model
            class="maskaown-entity"
            src="#maskaown"
            visible="false"
            position="0 0.5 0"
            scale="1 1 1"
            rotation="0 0 0"
            material="color: #c2c2c2;"
          ></a-gltf-model>
        </a-entity>
      </a-scene>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const list = ["maska1", "maska3", "maska2", "maskaown"];
        const visibles = [false, false, false, false];
        const allEntities = list.map((item) =>
          document.querySelectorAll("." + item + "-entity")
        );
        let currentIndex = 0;

        const returnIndex = localStorage.getItem("returnIndex");
        if (returnIndex !== null) {
          currentIndex = parseInt(returnIndex, 10);
          localStorage.removeItem("returnIndex");
        }

        function showOnly(index) {
          list.forEach((_, i) => {
            const visible = i === index;
            visibles[i] = visible;
            allEntities[i].forEach((entity) => {
              entity.setAttribute("visible", visible);
              if (visible) {
                entity.removeAttribute("animation-mixer");
                const clipName =
                  list[i] === "maska1"
                    ? "animace zelena"
                    : list[i] === "maska2"
                    ? "animace masky"
                    : list[i] === "maska3"
                    ? "animace cerv"
                    : list[i] === "maskaown"
                    ? "myanimace"
                    : "";
                entity.setAttribute("animation-mixer", {
                  clip: clipName,
                  loop: "once",
                  clampWhenFinished: true,
                });
              }
            });
          });
          currentIndex = index;
          localStorage.setItem("returnIndex", `${index}`);
        }

        showOnly(currentIndex);

        document
          .querySelector("#img1")
          .addEventListener("click", () => showOnly(0));
        document
          .querySelector("#img2")
          .addEventListener("click", () => showOnly(1));
        document
          .querySelector("#img3")
          .addEventListener("click", () => showOnly(2));
        document
          .querySelector("#img4")
          .addEventListener("click", () => showOnly(3));

        // Swipe / Drag
        let startX = 0,
          isDragging = false;
        document.body.addEventListener("mousedown", (e) => {
          isDragging = true;
          startX = e.clientX;
        });
        document.body.addEventListener("mousemove", (e) => {
          if (isDragging) {
            const diff = e.clientX - startX;
            if (Math.abs(diff) > 50) {
              currentIndex =
                diff < 0
                  ? (currentIndex + 1) % list.length
                  : (currentIndex - 1 + list.length) % list.length;
              showOnly(currentIndex);
              isDragging = false;
            }
          }
        });
        document.body.addEventListener("mouseup", () => {
          isDragging = false;
        });

        document.body.addEventListener("touchstart", (e) => {
          startX = e.touches[0].clientX;
        });
        document.body.addEventListener("touchmove", (e) => {
          const diff = e.touches[0].clientX - startX;
          if (Math.abs(diff) > 50) {
            currentIndex =
              diff < 0
                ? (currentIndex + 1) % list.length
                : (currentIndex - 1 + list.length) % list.length;
            showOnly(currentIndex);
            startX = e.touches[0].clientX;
          }
        });
      });

      function downloadMaskaown() {
        const maskModel = document.querySelector(".maskaown-entity");
        if (!maskModel) {
          alert("Mask object not found!");
          return;
        }

        const scene = maskModel.object3D.parent;
        const width = 512;
        const height = 512;

        const renderer = new THREE.WebGLRenderer({
          preserveDrawingBuffer: true,
          alpha: true,
        });
        renderer.setSize(width, height);
        renderer.setClearColor(0x000000, 0); // transparent

        const camera = new THREE.PerspectiveCamera(
          50,
          width / height,
          0.1,
          1000
        );
        camera.position.set(0, 0.5, 1);
        camera.lookAt(0, 0.5, 0);

        renderer.render(scene, camera);

        renderer.domElement.toBlob((blob) => {
          const link = document.createElement("a");
          link.download = "maskaown.png";
          link.href = URL.createObjectURL(blob);
          link.click();
          URL.revokeObjectURL(link.href);
          renderer.dispose();
        });
      }
    </script>
  </body>
</html>
