<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
    <script src="https://cdn.rawgit.com/donmccurdy/aframe-extras/v5.0.1/dist/aframe-extras.min.js"></script>
    <link rel="stylesheet" href="style.css" />
    <title>DRON PRO MASK</title>
    <style></style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.177.0/examples/jsm/"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.177.0/build/three.module.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="icon" type="image/png" href="/faviconadron.png" />
    <!-- Apple (iOS / iPadOS) home screen icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/faviconadron.png" />

    <!-- Android / Chrome / PWAs (Progressive Web Apps) -->
    <link rel="manifest" href="/manifest.json" />
  </head>

  <body>
    <div class="carousel-wrapper">
      <div class="ikony">
        <img class="obrazky" id="img1" src="/skin1.png" alt="Green Icon" />
        <img class="obrazky" id="img2" src="/skin2.png" alt="Red Icon" />
        <img class="obrazky" id="img3" src="/skin3.png" alt="Blue Icon" />
        <img class="obrazky" id="img4" src="/myown2.png" alt="My Own Mask" />
        <img
          class="edit-button"
          id="img5"
          src="/editown2.png"
          alt="Edit Icon"
          onclick="{localStorage.setItem('returnIndex', 3); window.location.href = 'platno.html'}"
        />
        <img
          class="edit-button"
          id="screenshotBtn"
          src="/photo.png"
          alt="Photo Icon"
        />
        <img
          class="edit-button"
          id="cameraBtn"
          src="/START2.png"
          alt="Photo Icon"
        />
      </div>
    </div>

    <div class="example-container">
      <a-scene
        mindar-face
        embedded
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        screenshot
        arjs="..."
        mindar="..."
      >
        <a-assets>
          <a-asset-item
            id="headModel"
            src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/sparkar/headOccluder.glb"
          ></a-asset-item>
          <a-asset-item id="maska1" src="/models/coremodel.glb"></a-asset-item>
          <a-asset-item id="maska2" src="/models/academy2.glb"></a-asset-item>
          <a-asset-item id="maska3" src="/models/fpv6.glb"></a-asset-item>
          <a-asset-item
            id="maskaown"
            src="/models/zakladnibasic.glb"
          ></a-asset-item>
        </a-assets>

        <a-camera
          look-controls="enabled: false"
          position="0 0 0"
          cursor="rayOrigin: mouse"
          raycaster="objects: .clickable"
        ></a-camera>

        <a-light
          type="directional"
          intensity="3"
          position="0 0.8 10"
          castShadow="true"
        ></a-light>

        <a-entity mindar-face-target="anchorIndex: 1">
          <a-gltf-model
            id="headModelEntity"
            class="clickable"
            mindar-face-occluder
            position="0 -0.3 0.15"
            rotation="0 0 0"
            scale="1 1 1"
            src="#headModel"
            visible="true"
          ></a-gltf-model>
        </a-entity>

        <a-entity mindar-face-target="anchorIndex: 9">
          <a-gltf-model
            class="maska1-entity"
            src="#maska1"
            visible="true"
            position="0 0.5 0"
            scale="1 1 1"
            rotation="0 0 0"
            shadow="cast: true; receive: true"
          ></a-gltf-model>
        </a-entity>

        <a-entity mindar-face-target="anchorIndex: 9">
          <a-gltf-model
            class="maska2-entity"
            src="#maska2"
            visible="false"
            position="0 0.5 0"
            scale="1 1 1"
            rotation="0 0 0"
            shadow="cast: true; receive: true"
          ></a-gltf-model>
        </a-entity>

        <a-entity mindar-face-target="anchorIndex: 9">
          <a-gltf-model
            class="maska3-entity"
            src="#maska3"
            visible="false"
            position="0 0.5 0"
            scale="1 1 1"
            rotation="0 0 0"
            shadow="cast: true; receive: true"
          ></a-gltf-model>
        </a-entity>

        <a-entity mindar-face-target="anchorIndex: 9">
          <a-gltf-model
            class="maskaown-entity"
            src="#maskaown"
            visible="false"
            position="0 0.5 0"
            scale="1 1 1"
            rotation="0 0 0"
            material="roughness: 1; metalness: 0; color: #c2c2c2;"
            shadow="cast: false; receive: false"
          ></a-gltf-model>
        </a-entity>
      </a-scene>
    </div>

    <script>
      // robust AR screenshot + recording (separate flows)
      // Assumes: <img id="screenshotBtn"> and <img id="cameraBtn"> exist,
      // an <a-scene> exists, and your camera video element is either inside .example-container or available via document.querySelector('video').

      let mediaRecorder = null;
      let recordedChunks = [];
      let recording = false;
      let recordingState = { finalCanvas: null, ctx: null, rafId: null };

      // utility: wait until conditionFn() returns truthy or timeout
      function waitFor(conditionFn, timeout = 3000, interval = 100) {
        return new Promise((resolve, reject) => {
          const start = Date.now();
          (function check() {
            try {
              const v = conditionFn();
              if (v) return resolve(v);
            } catch (e) {
              // ignore
            }
            if (Date.now() - start > timeout)
              return reject(new Error("timeout"));
            setTimeout(check, interval);
          })();
        });
      }

      // find the best video element
      function findVideoElement() {
        const container = document.querySelector(".example-container");
        if (container) {
          const v = container.querySelector("video");
          if (v) return v;
        }
        // fallback
        return document.querySelector("video");
      }

      // safe dims: fallback to client size if video metadata not ready
      function getVideoDims(video) {
        const w = video.videoWidth || video.clientWidth || 640;
        const h = video.videoHeight || video.clientHeight || 480;
        return { w, h };
      }

      // small visual record indicator
      function showRecordIndicator() {
        let el = document.getElementById("record-indicator");
        if (!el) {
          el = document.createElement("div");
          el.id = "record-indicator";
          el.textContent = "● REC";
          Object.assign(el.style, {
            position: "fixed",
            right: "12px",
            top: "12px",
            zIndex: 99999,
            background: "rgba(0,0,0,0.6)",
            color: "white",
            padding: "6px 8px",
            borderRadius: "12px",
            fontFamily: "monospace",
            fontSize: "13px",
            display: "flex",
            alignItems: "center",
            gap: "8px",
          });
          document.body.appendChild(el);
        }
        el.style.display = "flex";
      }
      function hideRecordIndicator() {
        const el = document.getElementById("record-indicator");
        if (el) el.style.display = "none";
      }

      // --------------------- SCREENSHOT (uses screenshot component) ---------------------
      document
        .getElementById("screenshotBtn")
        .addEventListener("click", async () => {
          try {
            const scene = document.querySelector("a-scene");
            if (!scene) throw new Error("<a-scene> not found on the page.");
            const videoEl = findVideoElement();
            if (!videoEl)
              throw new Error(
                "No <video> element found (looked inside .example-container then document)."
              );

            // wait for screenshot component or scene load
            await waitFor(
              () =>
                (scene.components && scene.components.screenshot) ||
                scene.hasLoaded,
              3000
            ).catch(() => null);

            // ensure video metadata available
            if (videoEl.readyState < 2) {
              await new Promise((res) =>
                videoEl.addEventListener("loadedmetadata", res, { once: true })
              );
            }
            const { w: vw, h: vh } = getVideoDims(videoEl);

            // prefer screenshot component (it gives correct mask flattening)
            let screenshotCanvas = null;
            if (
              scene.components &&
              scene.components.screenshot &&
              typeof scene.components.screenshot.getCanvas === "function"
            ) {
              try {
                screenshotCanvas =
                  scene.components.screenshot.getCanvas("perspective");
              } catch (e) {
                // continue to fallback
                console.warn("screenshot.getCanvas error:", e);
              }
            }

            // fallback: try scene.canvas (may or may not include correct alpha depending on your setup)
            if (!screenshotCanvas) {
              console.warn(
                "screenshot component not available or returned null — falling back to scene.canvas (may not composite as expected)."
              );
              if (!scene.canvas)
                throw new Error(
                  "Neither screenshot component canvas nor scene.canvas is available."
                );
              screenshotCanvas = scene.canvas;
            }

            // compose final canvas (video mirrored + mask)
            const finalCanvas = document.createElement("canvas");
            finalCanvas.width = vw;
            finalCanvas.height = vh;
            const ctx = finalCanvas.getContext("2d");

            // mirrored webcam
            ctx.save();
            ctx.scale(-1, 1);
            ctx.drawImage(
              videoEl,
              0,
              0,
              videoEl.videoWidth || vw,
              videoEl.videoHeight || vh,
              -vw,
              0,
              vw,
              vh
            );
            ctx.restore();

            // draw AR mask / scene on top
            ctx.drawImage(
              screenshotCanvas,
              0,
              0,
              screenshotCanvas.width || vw,
              screenshotCanvas.height || vh,
              0,
              0,
              vw,
              vh
            );

            // try download — if canvas is tainted this will throw (security error)
            try {
              const link = document.createElement("a");
              link.download = "DRON_SCREENSHOT.png";
              link.href = finalCanvas.toDataURL("image/png");
              link.click();
            } catch (ex) {
              console.error("Canvas export failed (tainted?):", ex);
              alert(
                "Screenshot failed: canvas is tainted or blocked. See console for details."
              );
            }
          } catch (err) {
            console.error(err);
            alert(
              "Screenshot failed: " +
                (err && err.message ? err.message : String(err))
            );
          }
        });

      // --------------------- RECORDING (uses live scene.canvas) ---------------------
      document
        .getElementById("cameraBtn")
        .addEventListener("click", async () => {
          if (recording) {
            // already recording → ignore extra clicks
            return;
          }

          try {
            const scene = document.querySelector("a-scene");
            if (!scene) throw new Error("<a-scene> not found on the page.");
            const videoEl = findVideoElement();
            if (!videoEl)
              throw new Error(
                "No <video> element found (looked inside .example-container then document)."
              );

            // wait for scene canvas
            await waitFor(() => scene.canvas || scene.hasLoaded, 3000).catch(
              () => null
            );
            const sceneCanvas =
              scene.canvas || (scene.renderer && scene.renderer.domElement);
            if (!sceneCanvas)
              throw new Error(
                "Scene WebGL canvas not available (scene.canvas is null)."
              );

            // ensure video ready
            if (videoEl.readyState < 2) {
              await new Promise((res) =>
                videoEl.addEventListener("loadedmetadata", res, { once: true })
              );
            }
            const { w: vw, h: vh } = getVideoDims(videoEl);

            // prepare final canvas
            const finalCanvas = document.createElement("canvas");
            finalCanvas.width = vw;
            finalCanvas.height = vh;
            const ctx = finalCanvas.getContext("2d");

            recordingState.finalCanvas = finalCanvas;
            recordingState.ctx = ctx;

            // setup MediaRecorder
            const stream = finalCanvas.captureStream(30);
            let mimeType = "video/mp4;codecs=vp9";
            if (!MediaRecorder.isTypeSupported(mimeType)) {
              mimeType = "video/mp4;codecs=vp8";
              if (!MediaRecorder.isTypeSupported(mimeType)) {
                mimeType = "video/mp4";
                if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = "";
              }
            }
            const options = mimeType ? { mimeType } : undefined;
            recordedChunks = [];
            mediaRecorder = options
              ? new MediaRecorder(stream, options)
              : new MediaRecorder(stream);

            mediaRecorder.ondataavailable = (e) => {
              if (e.data && e.data.size) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
              try {
                const blob = new Blob(recordedChunks, {
                  type: recordedChunks[0]?.type || "video/mp4",
                });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "DRON_RECORDING.mp4";
                a.click();
                setTimeout(() => URL.revokeObjectURL(url), 5000);
              } catch (ex) {
                console.error("Failed to save recording:", ex);
                alert("Recording save failed. See console for details.");
              }
            };

            // frame drawing loop
            function drawFrame() {
              ctx.clearRect(0, 0, finalCanvas.width, finalCanvas.height);

              // draw mirrored video
              ctx.save();
              ctx.scale(-1, 1);
              ctx.drawImage(
                videoEl,
                0,
                0,
                videoEl.videoWidth || vw,
                videoEl.videoHeight || vh,
                -vw,
                0,
                vw,
                vh
              );
              ctx.restore();

              // draw AR overlay
              try {
                ctx.drawImage(
                  scene.canvas,
                  0,
                  0,
                  scene.canvas.width,
                  scene.canvas.height,
                  0,
                  0,
                  vw,
                  vh
                );
              } catch (ex) {
                console.error("Failed to draw scene canvas:", ex);
                stopRecordingDueToError("Canvas draw failed. See console.");
                return;
              }

              recordingState.rafId = requestAnimationFrame(drawFrame);
            }

            // start recording
            mediaRecorder.start();
            recording = true;
            showRecordIndicator();
            drawFrame();

            // auto-stop after 10s
            setTimeout(() => {
              if (recording) {
                if (recordingState.rafId)
                  cancelAnimationFrame(recordingState.rafId);
                recordingState.rafId = null;

                if (mediaRecorder && mediaRecorder.state !== "inactive") {
                  mediaRecorder.stop();
                }

                recording = false;
                hideRecordIndicator();
              }
            }, 10000);
          } catch (ex) {
            console.error("Failed to start recording:", ex);
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
              try {
                mediaRecorder.stop();
              } catch (e) {}
            }
            recording = false;
            hideRecordIndicator();
          }
        });

      document.addEventListener("DOMContentLoaded", function () {
        const list = ["maska1", "maska3", "maska2", "maskaown"];
        const visibles = [false, false, false, false];
        const allEntities = list.map((item) =>
          document.querySelectorAll("." + item + "-entity")
        );
        let currentIndex = 0;

        let returnIndex = localStorage.getItem("returnIndex");
        if (returnIndex !== null) {
          currentIndex = parseInt(returnIndex, 10);
          localStorage.removeItem("returnIndex");
        }

        function showOnly(index) {
          list.forEach((_, i) => {
            const visible = i === index;
            visibles[i] = visible;
            allEntities[i].forEach((entity) => {
              entity.setAttribute("visible", visible);
              if (visible) {
                entity.removeAttribute("animation-mixer");

                const clipName =
                  list[i] === "maska1"
                    ? "animace zelena"
                    : list[i] === "maska2"
                    ? "animace masky"
                    : list[i] === "maska3"
                    ? "animace cerv"
                    : list[i] === "maskaown"
                    ? "myanimace"
                    : "";

                entity.setAttribute("animation-mixer", {
                  clip: clipName,
                  loop: "once",
                  clampWhenFinished: true,
                });
              }
            });
          });
          currentIndex = index;
          localStorage.setItem("returnIndex", `${index}`);
        }

        const customMaskTexture = localStorage.getItem("customMaskTexture");
        if (customMaskTexture) {
          const maskModel = document.querySelector(".maskaown-entity");
          if (maskModel.getObject3D("mesh")) {
            applyTextureFromData(maskModel, customMaskTexture);
          } else {
            maskModel.addEventListener("model-loaded", () => {
              applyTextureFromData(maskModel, customMaskTexture);
            });
          }
        }

        showOnly(currentIndex);

        document.querySelector("#img1").addEventListener("click", () => {
          showOnly(0);
        });
        document.querySelector("#img2").addEventListener("click", () => {
          showOnly(1);
        });
        document.querySelector("#img3").addEventListener("click", () => {
          showOnly(2);
        });
        document.querySelector("#img4").addEventListener("click", () => {
          showOnly(3);
        });

        const headModelEntity = document.querySelector("#headModelEntity");
        headModelEntity.addEventListener("click", () => {
          const currentEntities = allEntities[currentIndex];
          currentEntities.forEach((entity) => {
            if (visibles[currentIndex]) {
              entity.removeAttribute("animation-mixer");

              const clipName =
                list[currentIndex] === "maska1"
                  ? "animace zelena"
                  : list[currentIndex] === "maska2"
                  ? "animace masky"
                  : list[currentIndex] === "maska3"
                  ? "animace cerv"
                  : list[currentIndex] === "maskaown"
                  ? "myanimace"
                  : "";

              entity.setAttribute("animation-mixer", {
                clip: clipName,
                loop: "once",
                clampWhenFinished: true,
              });
            }
          });
        });

        let startX = 0;
        let isDragging = false;

        document.body.addEventListener("mousedown", function (event) {
          isDragging = true;
          startX = event.clientX;
        });

        document.body.addEventListener("mousemove", function (event) {
          if (isDragging) {
            const diff = event.clientX - startX;
            if (Math.abs(diff) > 50) {
              if (diff < 0) {
                currentIndex = (currentIndex + 1) % list.length;
              } else if (diff > 0) {
                currentIndex = (currentIndex - 1 + list.length) % list.length;
              }
              showOnly(currentIndex);
              isDragging = false;
            }
          }
        });

        document.body.addEventListener("mouseup", function () {
          isDragging = false;
        });

        let startTouchX = 0;

        document.body.addEventListener("touchstart", function (event) {
          startTouchX = event.touches[0].clientX;
        });

        document.body.addEventListener("touchmove", function (event) {
          const diff = event.touches[0].clientX - startTouchX;
          if (Math.abs(diff) > 50) {
            if (diff < 0) {
              currentIndex = (currentIndex + 1) % list.length;
            } else {
              currentIndex = (currentIndex - 1 + list.length) % list.length;
            }
            showOnly(currentIndex);
            startTouchX = event.touches[0].clientX;
          }
        });
      });

      function applyTextureFromData(model, dataURL) {
        const textureLoader = new THREE.TextureLoader();
        textureLoader.load(dataURL, (texture) => {
          texture.flipY = false;

          // ✅ make sure texture is read as sRGB
          texture.encoding = THREE.sRGBEncoding;
          texture.needsUpdate = true;

          model.getObject3D("mesh").traverse((node) => {
            if (node.isMesh) {
              const overlayMaterial = new THREE.MeshStandardMaterial({
                map: texture,
                transparent: true,
                opacity: 1,
                depthWrite: false,
                roughness: 1,
                metalness: 0,
                color: new THREE.Color(0xaaaaaa),
                polygonOffset: true,
                polygonOffsetFactor: -1, // push forward
                polygonOffsetUnits: -1,
              });

              const overlayMesh = new THREE.Mesh(
                node.geometry.clone(),
                overlayMaterial
              );
              overlayMesh.position.copy(node.position);
              overlayMesh.rotation.copy(node.rotation);
              overlayMesh.scale.copy(node.scale);

              node.parent.add(overlayMesh);
            }
          });
        });
      }
    </script>
  </body>
</html>
